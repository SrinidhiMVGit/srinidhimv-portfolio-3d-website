# Simple workflow for deploying static content to Github Pages
name: Deploy React app to Pages

on:
  # FIX: This ensures the site actually builds and deploys when you push code to main
  push:
    branches: ['main']

  # Keeps your pull request check if you want to test builds before merging
  pull_request:
    branches: ['main']

  # Allows you to run this workflow manually from the actions tab
  workflow_dispatch:
    
# Sets the GITHUB_TOKEN permissions to allow deployment to Github Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allows one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Updated to v4 for faster execution and better security
        uses: actions/checkout@v4 
      - name: Set up Node
        # Updated to v4 
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Node 20 is the modern LTS version
          cache: 'npm'
      - name: Install dependencies
        # 'npm ci' is preferred for automation over 'npm install' as it's faster and stricter
        run: npm ci 
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload dist repository (Make sure your vite.config.js base path is set to your repo name!)
          path: './dist'
      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v4
